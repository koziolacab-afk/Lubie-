name: Build ESP32-S3 firmware

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz repo
        uses: actions/checkout@v4

      - name: Zainstaluj Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Dodaj ESP32
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index

      - name: Zainstaluj ESP32 core 3.3.11
        run: |
          arduino-cli core install esp32:esp32@3.3.11

      - name: Zainstaluj biblioteki
        run: |
          arduino-cli lib update-index
          arduino-cli lib install "SuplaDevice"
          arduino-cli lib install "ModbusMaster"
          arduino-cli lib install "OneWire"
          arduino-cli lib install "DallasTemperature"

      - name: Kompilacja
        run: |
          mkdir -p build

          arduino-cli compile \
            --fqbn "esp32:esp32:esp32s3:FlashSize=8M,PartitionScheme=default_8MB,CDCOnBoot=cdc,USBMode=hwcdc,PSRAM=disabled,DebugLevel=info" \
            --output-dir build \
            MelcoBEMS_SUPLA

      - name: Utworz firmware.bin
        run: |
          cp build/*.ino.bin build/firmware.bin
          size=$(stat -c%s build/firmware.bin)
          max_size=$((0x330000))
          if [ "$size" -gt "$max_size" ]; then
            echo "::error::firmware.bin (${size} B) exceeds OTA slot (${max_size} B)"
            exit 1
          fi
          ls -lah build

      - name: Zapisz firmware jako artifact
        uses: actions/upload-artifact@v4
        with:
          name: MelcoBEMS-firmware
          path: build/firmware.bin

      - name: Utworz lub zaktualizuj Release OTA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view ota > /dev/null 2>&1; then
            echo "Release ota istnieje - podmieniam firmware.bin"
            gh release upload ota build/firmware.bin --clobber
          else
            echo "Tworze pierwszy Release ota"
            gh release create ota build/firmware.bin \
              --target "$GITHUB_SHA" \
              --title "MelcoBEMS OTA" \
              --notes "Staly release do recznych aktualizacji OTA."
          fi
